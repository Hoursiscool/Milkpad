; Milkpad feature registry
; Edit this file and restart Milkpad to change optional capabilities.
; Keys are registered in RegisterFeature() inside Program.cs.

[Features]
; Show the Load Lua script button in View -> Customize.
lua-scripts = on

; Let a d20 result open the matching installed app's normal uninstaller.
; Set to off to keep the ROLL THE DICE shelf purely virtual.
break-uninstall = on
