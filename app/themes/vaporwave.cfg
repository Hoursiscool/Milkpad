; Milkpad theme — pastel grid horizons, chrome type, and a VHS sunset.
[Info]
name = Vaporwave
dark = 1

[Colors]
chrome = #1A1032
panel = #2C1A4A
page = #100A22
text = #FFE8FB
muted = #B7A3D8
border = #5F3A83
