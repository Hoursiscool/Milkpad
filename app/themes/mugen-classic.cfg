; Milkpad theme — a nod to the classic MUGEN motif: charcoal panels, warm
; yellow highlights, and a no-nonsense monospace editing surface.
[Info]
name = Mugen Classic
dark = 1

[Colors]
chrome = #121212
panel = #232323
page = #0A0A0A
text = #F0F0F0
muted = #A0A0A0
border = #444444
accent = #FFD34E
editor = #0D0D0D
editorfg = #F4F4F4

[Editor]
font = Consolas
size = 11
tab = 4
softtabs = 1

[Behavior]
wrap = 1
autoindent = 1
statusbar = 1
ontop = 0
