; Milkpad theme — inspired by the amber-and-cabinet look of a MUGEN arcade motif.
; Drop this file in the themes folder beside milkpad.exe, or in
; %APPDATA%\Milkpad\themes. It appears in View → Customize → Preset.

[Info]
name = Arcade Dojo
dark = 1

[Colors]
chrome = #17110E
panel = #2A1D16
page = #0F0B09
text = #F5E6C8
muted = #B59A72
border = #5A3D27
accent = #F2A33A
editor = #120E0B
editorfg = #F3D9A4

[Editor]
font = Consolas
size = 12
tab = 4
softtabs = 1

[Behavior]
wrap = 1
autoindent = 1
statusbar = 1
ontop = 0
